name: Weekly Market Intelligence

on:
  schedule:
    - cron: "0 1 * * 1"
  workflow_dispatch:
    inputs:
      topic:
        description: "Topic to run"
        required: true
        default: "AI"
        type: choice
        options:
          - AI
          - FinOps
          - ProductObservation
      max_articles:
        description: "Maximum articles to process with LLM"
        required: true
        default: "1"
        type: string
      skip_slides:
        description: "Skip slide draft generation"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

jobs:
  run-market-intelligence:
    runs-on: ubuntu-latest

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run market intelligence workflow
        run: |
          TOPIC="${{ github.event.inputs.topic }}"
          MAX_ARTICLES="${{ github.event.inputs.max_articles }}"
          SKIP_SLIDES="${{ github.event.inputs.skip_slides }}"

          if [ -z "$TOPIC" ]; then
            TOPIC="AI"
          fi

          if [ -z "$MAX_ARTICLES" ]; then
            MAX_ARTICLES="1"
          fi

          if [ -z "$SKIP_SLIDES" ]; then
            SKIP_SLIDES="true"
          fi

          if [ "$SKIP_SLIDES" = "true" ]; then
            python main.py --topic "$TOPIC" --run-mode weekly --max-articles "$MAX_ARTICLES" --skip-slides
          else
            python main.py --topic "$TOPIC" --run-mode weekly --max-articles "$MAX_ARTICLES"
          fi

      - name: Write workflow summary
        if: always()
        env:
          WORKFLOW_TOPIC: ${{ github.event.inputs.topic }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          artifact_name = "market-intelligence-outputs"
          topic = os.environ.get("WORKFLOW_TOPIC") or "AI"
          summary_path = None
          index_path = Path("outputs/index/report_index.json")

          if index_path.exists():
              try:
                  index = json.loads(index_path.read_text(encoding="utf-8"))
              except json.JSONDecodeError:
                  index = []

              if isinstance(index, list) and index:
                  candidate = index[0].get("run_summary_path")
                  if candidate and Path(candidate).exists():
                      summary_path = Path(candidate)

          if summary_path is None:
              candidate = Path("outputs/latest") / topic / "run_summary.json"
              if candidate.exists():
                  summary_path = candidate

          lines = [
              "# Weekly Market Intelligence",
              "",
              f"- Artifact name: {artifact_name}",
          ]

          if summary_path is None:
              lines.extend([
                  "- Workflow may have failed before report generation.",
                  "",
                  "## Key files",
                  "",
                  "- market_analysis_report.md",
                  "- review_summary.md",
                  "- copy_ready_report.md",
                  "- output_quality_review.md",
                  "",
              ])
          else:
              summary = json.loads(summary_path.read_text(encoding="utf-8"))
              metrics = summary.get("metrics", {})
              warnings = summary.get("warnings", [])
              lines.extend([
                  f"- Topic: {summary.get('topic', '')}",
                  f"- Run ID: {summary.get('run_id', '')}",
                  f"- Workflow status: {summary.get('status', '')}",
                  f"- Quality status: {summary.get('quality_status', '')}",
                  f"- Output type: {metrics.get('output_type', '')}",
                  "",
                  "## Warnings",
                  "",
              ])

              if warnings:
                  lines.extend(f"- {warning}" for warning in warnings)
              else:
                  lines.append("- None")

              lines.extend([
                  "",
                  "## Key files",
                  "",
                  "- market_analysis_report.md",
                  "- review_summary.md",
                  "- copy_ready_report.md",
                  "- output_quality_review.md",
                  "",
              ])

          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as file:
              file.write("\n".join(lines))
          PY

      - name: Upload generated outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-intelligence-outputs
          path: |
            outputs/runs/
            outputs/latest/
            outputs/index/
          retention-days: 30
